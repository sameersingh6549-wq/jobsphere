    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-light">
    {% include "jobs/header.html" %}
    <main class="container py-5">
        <div class="auth-card mx-auto shadow-lg rounded-4 overflow-hidden" style="max-width: 540px;">
            <div class="p-4 bg-primary text-white text-center">
                <h2 class="fw-bold mb-1">Welcome Back</h2>
                <p class="small opacity-85 mb-0">Log in to manage your profile, jobs, and applications.</p>
            </div>
            <div class="p-4 bg-white">
                {% include "accounts/messages.html" %}
                <form method="post" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="d-grid mt-3">
                        <button type="submit" class="btn btn-primary btn-lg">Login</button>
                    </div>
                </form>
                <div class="text-center text-muted small mt-4">
                    Don't have an account? <a class="text-primary" href="/accounts/signup/">Sign up</a>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
